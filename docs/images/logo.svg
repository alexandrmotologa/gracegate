<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="armor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0b0f19" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Sentinel Hound: 100% Watertight Solid Silhouette Base -->
      <path d="
        M 0 -220
        L 75 -290
        L 140 -325
        L 130 -220
        L 190 -130
        L 210 20
        L 170 160
        L 110 260
        L 0 310
        L -110 260
        L -170 160
        L -210 20
        L -190 -130
        L -130 -220
        L -140 -325
        L -75 -290
        Z
      " fill="#0b0f19" />

      <!-- Symmetrical Low-Poly Facets: Ears -->
      <!-- Left Ear (Viewer's Left, x < 0) -->
      <polygon points="-75,-290 -140,-325 -130,-220 -60,-200" fill="#1e293b" />
      <polygon points="-60,-200 -130,-220 -70,-150" fill="#334155" />
      <polygon points="-140,-325 -105,-260 -75,-290" fill="#475569" />

      <!-- Right Ear (Viewer's Right, x > 0) -->
      <polygon points="75,-290 140,-325 130,-220 60,-200" fill="#0f172a" />
      <polygon points="60,-200 130,-220 70,-150" fill="#1e293b" />
      <polygon points="140,-325 105,-260 75,-290" fill="#334155" />

      <!-- Cranium & Forehead Facets -->
      <polygon points="0,-220 -60,-200 -75,-290" fill="#334155" />
      <polygon points="0,-220 60,-200 75,-290" fill="#1e293b" />
      <polygon points="0,-220 -60,-200 0,-130" fill="#475569" />
      <polygon points="0,-220 60,-200 0,-130" fill="#334155" />

      <!-- Temples & Brow -->
      <polygon points="-60,-200 -190,-130 -110,-90 -70,-150" fill="#1e293b" />
      <polygon points="60,-200 190,-130 110,-90 70,-150" fill="#0f172a" />
      <polygon points="-60,-200 -70,-150 0,-130" fill="#334155" />
      <polygon points="60,-200 70,-150 0,-130" fill="#1e293b" />

      <!-- Predatory Cyan Optic Eyes (Almond Angle) -->
      <!-- Left Eye -->
      <polygon points="-30,-95 -95,-85 -70,-65 -25,-80" fill="url(#cyan-glow)" filter="drop-shadow(0 0 6px #00f5ff)" />
      <!-- Right Eye -->
      <polygon points="30,-95 95,-85 70,-65 25,-80" fill="url(#cyan-glow)" filter="drop-shadow(0 0 6px #00f5ff)" />

      <!-- Orbital Sockets & Brow Shields -->
      <polygon points="0,-130 -60,-110 -30,-95 0,-80" fill="#1e293b" />
      <polygon points="0,-130 60,-110 30,-95 0,-80" fill="#0f172a" />
      <polygon points="-60,-110 -110,-90 -95,-85 -70,-65" fill="#0f172a" />
      <polygon points="60,-110 110,-90 95,-85 70,-65" fill="#0b0f19" />

      <!-- Bridge of Snout -->
      <polygon points="0,-80 -25,-80 -20,20 0,35" fill="#475569" />
      <polygon points="0,-80 25,-80 20,20 0,35" fill="#334155" />

      <!-- Cheekbones & Zygomatic Arches -->
      <polygon points="-110,-90 -190,-130 -210,20 -120,40" fill="#334155" />
      <polygon points="110,-90 190,-130 210,20 120,40" fill="#1e293b" />
      <polygon points="-110,-90 -70,-65 -20,20 -120,40" fill="#1e293b" />
      <polygon points="110,-90 70,-65 20,20 120,40" fill="#0f172a" />

      <!-- Snout & Whisker Pads (Refined Titanium Slate, Lateral Spread) -->
      <polygon points="-20,20 -70,30 -60,95 -15,100" fill="#64748b" />
      <polygon points="20,20 70,30 60,95 15,100" fill="#475569" />
      <polygon points="-20,20 0,35 -15,100" fill="#94a3b8" />
      <polygon points="20,20 0,35 15,100" fill="#64748b" />

      <!-- Nose (Sharp Geometric Apex) -->
      <polygon points="0,35 -20,55 0,70 20,55" fill="#0b0f19" />

      <!-- Lower Jaw / Chin -->
      <polygon points="-15,100 0,110 15,100 0,135" fill="#334155" />
      <polygon points="-15,100 -60,95 -45,150 0,135" fill="#1e293b" />
      <polygon points="15,100 60,95 45,150 0,135" fill="#0f172a" />

      <!-- Guard Chevron Neck & Chest Armor (Gateway Sentinel Shield) -->
      <polygon points="-120,40 -210,20 -170,160 -80,180" fill="#1e293b" />
      <polygon points="120,40 210,20 170,160 80,180" fill="#0f172a" />
      <polygon points="-120,40 -45,150 -80,180" fill="#334155" />
      <polygon points="120,40 45,150 80,180" fill="#1e293b" />

      <!-- Core Chest Gate Chevron (Electric Cyan Accented) -->
      <polygon points="0,135 -45,150 -80,180 0,230" fill="#0f172a" />
      <polygon points="0,135 45,150 80,180 0,230" fill="#0b0f19" />

      <polygon points="-80,180 -170,160 -110,260 0,285" fill="#1e293b" />
      <polygon points="80,180 170,160 110,260 0,285" fill="#0f172a" />
      <polygon points="-80,180 0,230 0,285" fill="url(#armor-grad)" />
      <polygon points="80,180 0,230 0,285" fill="#1e293b" />

      <!-- Sentinel Core Locus Badge -->
      <circle cx="0" cy="205" r="8" fill="#00f5ff" filter="drop-shadow(0 0 8px #00f5ff)" />
      <line x1="-30" y1="205" x2="30" y2="205" stroke="#00f5ff" stroke-width="2" opacity="0.6" />

    </g>
  </g>
</svg>
